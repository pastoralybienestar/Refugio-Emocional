<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema Psicoemocional UCN</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.8/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Core Colors */
            --bg-main: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --white: #ffffff;
            
            /* Slate Palette */
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
            --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569; --slate-700: #334155;
            --slate-800: #1e293b; --slate-900: #0f172a;
            
            /* Indigo Palette */
            --indigo-50: #eef2ff; --indigo-100: #e0e7ff; --indigo-200: #c7d2fe; --indigo-300: #a5b4fc;
            --indigo-400: #818cf8; --indigo-500: #6366f1; --indigo-600: #4f46e5; --indigo-700: #4338ca;
            --indigo-800: #3730a3; --indigo-900: #312e81; --indigo-950: #1e1b4b;

            /* Emerald Palette */
            --emerald-50: #ecfdf5; --emerald-100: #d1fae5; --emerald-200: #a7f3d0; --emerald-300: #6ee7b7;
            --emerald-400: #34d399; --emerald-500: #10b981; --emerald-600: #059669; --emerald-700: #047857;
            --emerald-800: #065f46; --emerald-900: #064e3b;

            /* Rose Palette */
            --rose-50: #fff1f2; --rose-100: #ffe4e6; --rose-200: #fecdd3; --rose-300: #fda4af;
            --rose-400: #fb7185; --rose-500: #f43f5e; --rose-600: #e11d48; --rose-700: #be123c;
            --rose-800: #9f1239; --rose-900: #881337;

            /* Spacing & Radii */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-2xl: 1.5rem;
            --radius-3xl: 2rem;
            --radius-full: 9999px;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-inner: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        button {
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
        }
        
        button:disabled { cursor: not-allowed; }
        a { text-decoration: none; color: inherit; }
        textarea { font-family: inherit; resize: none; }

        /* Typography Utilities */
        .text-center { text-align: center; }
        .text-left { text-align: left; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .font-medium { font-weight: 500; }
        .uppercase { text-transform: uppercase; }
        .italic { font-style: italic; }
        
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-base { font-size: 1rem; line-height: 1.5rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
        .text-5xl { font-size: 3rem; line-height: 1; }
        .text-6xl { font-size: 3.75rem; line-height: 1; }
        .text-8xl { font-size: 6rem; line-height: 1; }

        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-bounce { animation: bounce 1s infinite; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }

        .figure-3d {
            display: inline-block;
            filter: drop-shadow(0px 12px 10px rgba(0,0,0,0.15)) drop-shadow(0px 4px 5px rgba(0,0,0,0.1));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        button:hover .figure-3d, .group:hover .figure-3d {
            transform: scale(1.15) translateY(-5px);
        }

        .card-3d {
            background: var(--white);
            box-shadow: 0px 15px 25px -5px rgba(0, 0, 0, 0.05), 
                        0px 8px 10px -6px rgba(0, 0, 0, 0.01),
                        inset 0px 2px 2px rgba(255, 255, 255, 1);
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-3xl);
        }

        .btn-3d-base { transition: all 0.15s ease-out; }
        .btn-3d-base:active {
            transform: translateY(4px) !important;
            box-shadow: none !important;
            margin-bottom: -4px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background-color: var(--slate-100); }
        ::-webkit-scrollbar-thumb { background: var(--rose-700); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--rose-900); }
        html { scrollbar-width: thin; scrollbar-color: var(--rose-700) var(--slate-100); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Dynamic Theme System */
        .theme-blue { --t-bg: #eff6ff; --t-text: #2563eb; --t-border: #bfdbfe; --t-hover: #60a5fa; --t-shadow: #93c5fd; }
        .theme-red { --t-bg: #fef2f2; --t-text: #dc2626; --t-border: #fecaca; --t-hover: #f87171; --t-shadow: #fca5a5; }
        .theme-orange { --t-bg: #fff7ed; --t-text: #ea580c; --t-border: #fed7aa; --t-hover: #fb923c; --t-shadow: #fdba74; }
        .theme-purple { --t-bg: #faf5ff; --t-text: #9333ea; --t-border: #e9d5ff; --t-hover: #c084fc; --t-shadow: #d8b4fe; }
        .theme-amber { --t-bg: #fffbeb; --t-text: #b45309; --t-border: #fde68a; --t-hover: #fbbf24; --t-shadow: #fcd34d; }
        .theme-lime { --t-bg: #f7fee7; --t-text: #4d7c0f; --t-border: #d9f99d; --t-hover: #a3e635; --t-shadow: #bef264; }
        .theme-rose { --t-bg: #fff1f2; --t-text: #e11d48; --t-border: #fecdd3; --t-hover: #fb7185; --t-shadow: #fda4af; }
        .theme-yellow { --t-bg: #fefce8; --t-text: #ca8a04; --t-border: #fef08a; --t-hover: #facc15; --t-shadow: #fde047; }
        .theme-emerald { --t-bg: #ecfdf5; --t-text: #059669; --t-border: #a7f3d0; --t-hover: #34d399; --t-shadow: #6ee7b7; }
        .theme-indigo { --t-bg: #eef2ff; --t-text: #4f46e5; --t-border: #c7d2fe; --t-hover: #818cf8; --t-shadow: #a5b4fc; }
        .theme-teal { --t-bg: #f0fdfa; --t-text: #0d9488; --t-border: #99f6e4; --t-hover: #2dd4bf; --t-shadow: #5eead4; }
        .theme-slate { --t-bg: #f8fafc; --t-text: #475569; --t-border: #e2e8f0; --t-hover: #cbd5e1; --t-shadow: #cbd5e1; }

        .theme-card { background-color: var(--t-bg); color: var(--t-text); border-color: var(--t-border); }
        .theme-card-interactive { box-shadow: 0 4px 0 var(--t-border); }
        .theme-card-interactive:hover { border-color: var(--t-hover); box-shadow: 0 4px 0 var(--t-shadow); }

        /* Layout Structure */
        .app-container { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 5rem; }
        .header { background: var(--white); border-bottom: 1px solid var(--slate-200); position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-sm); }
        .header-top { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; max-width: 72rem; margin: 0 auto; }
        .header-badge { display: flex; align-items: center; gap: 0.75rem; }
        .header-icon-bg { padding: 0.5rem; background-color: var(--indigo-600); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); color: var(--white); }
        .header-tag { font-size: 0.75rem; font-weight: 700; color: var(--indigo-600); text-transform: uppercase; letter-spacing: 0.1em; background: var(--indigo-50); padding: 0.375rem 1rem; border-radius: var(--radius-full); border: 1px solid var(--indigo-100); }
        
        .nav-scroll { max-width: 72rem; margin: 0 auto; padding: 0 1rem; overflow-x: auto; border-top: 1px solid var(--slate-100); background: rgba(248, 250, 252, 0.5); backdrop-filter: blur(8px); }
        .nav-container { display: flex; padding: 0.5rem; gap: 0.5rem; width: max-content; margin: 0 auto; }
        .nav-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: var(--radius-full); font-size: 0.875rem; font-weight: 900; white-space: nowrap; border: 2px solid transparent; transition: all 0.2s; }
        .nav-btn.active { background-color: var(--indigo-600); color: var(--white); box-shadow: 0 4px 0 var(--indigo-800); }
        .nav-btn.inactive { background-color: var(--white); border-color: var(--slate-200); color: var(--slate-600); box-shadow: 0 4px 0 var(--slate-200); }
        .nav-btn.inactive:hover { background-color: var(--slate-100); }

        .main-content { flex: 1; padding: 2rem 1rem; }
        .content-wrapper { max-width: 64rem; margin: 0 auto; }

        /* Common Components */
        .hero-header { text-align: center; margin-bottom: 3rem; padding-top: 1rem; }
        .hero-title { font-size: 2.25rem; font-weight: 900; color: var(--slate-900); margin-bottom: 1.5rem; letter-spacing: -0.025em; }
        .hero-desc { color: var(--slate-600); font-size: 1.125rem; font-weight: 500; line-height: 1.625; max-width: 42rem; margin: 0 auto; }
        .hero-highlight { color: var(--indigo-600); font-weight: 700; border-bottom: 2px solid var(--indigo-200); }

        .icon { width: 1.5rem; height: 1.5rem; display: inline-block; }
        .icon-sm { width: 1.25rem; height: 1.25rem; }
        .icon-lg { width: 1.75rem; height: 1.75rem; }

        /* Support Section */
        .support-box { margin-top: 3rem; background: var(--white); border-radius: var(--radius-3xl); padding: 2rem; text-align: center; position: relative; overflow: hidden; box-shadow: 0 15px 40px -10px rgba(0,0,0,0.1); border-bottom: 8px solid var(--indigo-200); }
        .support-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 0.5rem; background: linear-gradient(to right, #6366f1, #a855f7, #ec4899); }
        .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; background: var(--indigo-600); color: var(--white); font-weight: 900; padding: 1rem 2.5rem; border-radius: var(--radius-2xl); box-shadow: 0 6px 0 var(--indigo-800); font-size: 1.125rem; }
        .btn-primary:hover { background: var(--indigo-700); box-shadow: 0 4px 0 var(--indigo-800); }

        /* Chequeador View */
        .emotion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .emotion-item { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; border-radius: var(--radius-3xl); border-width: 2px; border-style: solid; }
        .emotion-item-emoji { font-size: 3rem; margin-bottom: 1rem; }
        .emotion-item-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; }

        .detail-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .detail-hero { padding: 2.5rem; border-radius: var(--radius-3xl); border: 2px solid; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--shadow-lg); position: relative; overflow: hidden; }
        .detail-emoji { font-size: 6rem; margin-bottom: 1.5rem; z-index: 10; }
        .detail-title { font-size: 1.875rem; font-weight: 900; text-transform: uppercase; z-index: 10; margin-bottom: 1rem; }
        .detail-desc { font-size: 1rem; font-weight: 500; opacity: 0.95; z-index: 10; }
        
        .box-title { font-size: 1.125rem; font-weight: 900; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .example-text { font-size: 0.875rem; color: var(--slate-600); font-style: italic; border-left: 4px solid var(--indigo-300); padding-left: 1rem; padding-top: 0.25rem; padding-bottom: 0.25rem; background: rgba(248, 250, 252, 0.5); border-radius: 0 var(--radius-xl) var(--radius-xl) 0; }
        
        .reflection-input { width: 100%; height: 8rem; padding: 1rem; font-size: 0.875rem; border: 2px solid var(--slate-200); border-radius: var(--radius-2xl); outline: none; background: var(--slate-50); box-shadow: var(--shadow-inner); transition: all 0.3s; }
        .reflection-input:focus { border-color: var(--indigo-400); box-shadow: 0 0 0 4px var(--indigo-100); }
        .btn-submit { width: 100%; padding: 0.875rem; border-radius: var(--radius-xl); font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 0.5rem; border: 2px solid; }
        .btn-submit.active { background: var(--indigo-100); color: var(--indigo-700); border-color: var(--indigo-200); }
        .btn-submit.active:hover { background: var(--indigo-200); }
        .btn-submit.disabled { background: var(--slate-100); color: var(--slate-400); border-color: var(--slate-200); cursor: not-allowed; }
        .success-msg { width: 100%; padding: 1rem; background: var(--emerald-50); color: var(--emerald-800); border-radius: var(--radius-xl); border: 2px solid var(--emerald-200); display: flex; flex-direction: column; align-items: center; gap: 0.5rem; box-shadow: var(--shadow-inner); }

        .activity-list { display: flex; flex-direction: column; gap: 1.25rem; }
        .activity-card { padding: 1.5rem; border-radius: var(--radius-2xl); border: 2px solid var(--slate-200); display: flex; align-items: flex-start; gap: 1.25rem; cursor: pointer; transition: all 0.2s; background: var(--white); box-shadow: 0 4px 0 var(--slate-200); }
        .activity-card:hover { border-color: var(--indigo-300); box-shadow: 0 4px 0 var(--indigo-300); }
        .activity-card.completed { background: var(--emerald-50); border-color: var(--emerald-300); opacity: 0.7; transform: scale(0.98); box-shadow: none; }
        .act-check { flex-shrink: 0; width: 2rem; height: 2rem; border-radius: var(--radius-full); border: 3px solid var(--slate-300); display: flex; align-items: center; justify-content: center; margin-top: 0.25rem; transition: background 0.2s; }
        .activity-card.completed .act-check { background: var(--emerald-500); border-color: var(--emerald-500); color: var(--white); }
        .act-title { font-weight: 900; font-size: 1.125rem; color: var(--slate-800); }
        .activity-card.completed .act-title { text-decoration: line-through; color: var(--slate-500); }
        .act-desc { color: var(--slate-600); margin-top: 0.5rem; font-size: 1rem; }

        /* PAE & PAP Sections */
        .pae-section { background: var(--rose-50); border-color: var(--rose-100); padding: 2rem; margin-top: 3rem; margin-bottom: 2rem; }
        .pae-title { font-size: 1.5rem; font-weight: 900; color: var(--rose-800); display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .pae-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 2rem; }
        .pae-card { background: var(--white); padding: 1.5rem; border-radius: var(--radius-2xl); border: 1px solid var(--rose-100); box-shadow: var(--shadow-sm); transition: box-shadow 0.2s; }
        .pae-card:hover { box-shadow: var(--shadow-md); }
        
        .pap-section { background: var(--indigo-900); border-color: var(--indigo-800); color: var(--white); padding: 2rem; position: relative; overflow: hidden; margin-bottom: 2.5rem; }
        .pap-bg-icon { position: absolute; top: -2.5rem; right: -2.5rem; padding: 1rem; opacity: 0.1; color: var(--white); width: 16rem; height: 16rem; }
        .pap-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; position: relative; z-index: 10; }
        .pap-card { background: rgba(55, 48, 163, 0.6); padding: 1.5rem; border-radius: var(--radius-2xl); border: 1px solid rgba(79, 70, 229, 0.5); backdrop-filter: blur(4px); }
        .pap-num { width: 2rem; height: 2rem; background: var(--indigo-500); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 0.875rem; font-weight: 900; box-shadow: var(--shadow-inner); flex-shrink: 0;}
        
        .guide-box { background: rgba(30, 27, 75, 0.6); padding: 1.5rem; border-radius: var(--radius-2xl); border: 1px solid rgba(99, 102, 241, 0.3); display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 1rem; }
        .guide-pills { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        .guide-pill { padding: 0.5rem 1.25rem; background: rgba(99, 102, 241, 0.2); border-radius: var(--radius-xl); border: 1px solid rgba(99, 102, 241, 0.5); font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; }
        
        .dir-box { background: rgba(79, 70, 229, 0.2); padding: 1.5rem; border-radius: var(--radius-2xl); border: 1px solid rgba(129, 140, 248, 0.3); display: flex; flex-direction: column; gap: 1.5rem; text-align: center; }
        .btn-white { background: var(--white); color: var(--indigo-900); font-weight: 900; padding: 1rem 2rem; border-radius: var(--radius-2xl); box-shadow: 0 4px 0 var(--indigo-200); display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }

        /* Simulator View */
        .sim-header { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
        .sim-badge { font-size: 0.875rem; font-weight: 900; color: var(--indigo-600); background: var(--indigo-50); padding: 0.5rem 1.25rem; border-radius: var(--radius-full); border: 1px solid var(--indigo-200); align-self: flex-start; }
        .progress-track { width: 100%; background: var(--slate-100); height: 1rem; border-radius: var(--radius-full); border: 1px solid var(--slate-200); overflow: hidden; margin-bottom: 3rem; }
        .progress-fill { height: 100%; background: linear-gradient(to right, var(--indigo-500), #a855f7); transition: width 0.5s ease-out; }
        
        .question-text { font-size: 1.5rem; color: var(--slate-800); font-weight: 900; margin-bottom: 2.5rem; line-height: 1.4; }
        .option-btn { width: 100%; text-align: left; padding: 1.5rem; border-radius: var(--radius-2xl); border: 2px solid var(--slate-200); background: var(--white); font-size: 1.125rem; color: var(--slate-700); font-weight: 500; margin-bottom: 1rem; box-shadow: 0 4px 0 var(--slate-200); }
        .option-btn:hover { background: var(--indigo-50); border-color: var(--indigo-300); box-shadow: 0 4px 0 var(--indigo-300); }

        .result-wrapper { padding: 3rem; border-radius: var(--radius-3xl); border-bottom-width: 8px; border-style: solid; display: inline-block; margin-bottom: 2.5rem; box-shadow: var(--shadow-xl); position: relative; }
        .info-panel { background: var(--slate-50); padding: 2rem; border-radius: var(--radius-3xl); border: 2px solid var(--slate-100); box-shadow: var(--shadow-inner); margin-bottom: 2.5rem; text-align: left; }
        .rec-item { background: var(--white); padding: 1.5rem; border-radius: var(--radius-2xl); border: 1px solid var(--slate-200); box-shadow: var(--shadow-sm); display: flex; gap: 1rem; margin-bottom: 1rem; text-align: left; }
        .btn-dark { width: 100%; padding: 1.25rem; background: var(--slate-800); color: var(--white); font-weight: 900; border-radius: var(--radius-2xl); box-shadow: 0 6px 0 var(--slate-900); font-size: 1.125rem; }

        /* PsicoEdu View */
        .edu-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        .concept-card { border-radius: var(--radius-3xl); border: 2px solid var(--slate-200); background: var(--white); cursor: pointer; transition: all 0.5s; position: relative; overflow: hidden; }
        .concept-card:hover { border-color: var(--indigo-200); box-shadow: var(--shadow-sm); }
        .concept-card.expanded { transform: scale(1.02); z-index: 10; box-shadow: var(--shadow-lg); }
        .concept-inner { padding: 2rem; position: relative; z-index: 10; }
        .concept-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .concept-icon-box { width: 4rem; height: 4rem; border-radius: var(--radius-2xl); display: flex; align-items: center; justify-content: center; border: 2px solid; box-shadow: var(--shadow-inner); }

                const newScores = { ...scores };
                for (let key in effect) { newScores[key] += effect[key]; }
                setScores(newScores);

                if (step < SIMULATOR_QUESTIONS.length - 1) {
                    setStep(step + 1);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    let maxEmotion = 'sadness';
                    let maxVal = newScores['sadness'];
                    for (let key in newScores) {
                        if (newScores[key] > maxVal) { maxVal = newScores[key]; maxEmotion = key; }
                    }
                    const fullEmotion = EMOTIONS.find(e => e.id === maxEmotion) || EMOTIONS[0];
                    setResult(fullEmotion);
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                        </h2>
                        <p className="text-lg font-medium" style={{color:'var(--slate-600)', marginTop:'1.5rem', maxWidth:'42rem', margin:'1.5rem auto 0'}}>
                            No se trata de suprimir lo que sientes, sino de usar tus emociones a tu favor. Explora los 5 pilares fundamentales y entrena tu gimnasio mental.
                        </p>
                    </div>

                    <div className="ei-hero">
                        <div className="ei-overlay"></div>
                        <div className="ei-blob-1"></div>
                        <div className="ei-blob-2"></div>
                        
                        <div style={{textAlign: 'center', position: 'relative', zIndex: 10, marginBottom: '2.5rem'}}>
                            <h3 className="text-2xl font-black text-white" style={{display:'flex', alignItems:'center', justifyContent:'center', gap:'0.75rem'}}>
                                <span className="text-4xl figure-3d">🏛️</span> Los 5 Pilares de Goleman
                            </h3>
                            <p style={{color: 'var(--slate-300)', marginTop: '0.5rem', fontWeight: 500}}>Toca cada pilar para descubrir su poder oculto</p>
                        </div>
                        
                        <div className="pillars-grid">
                            {EI_PILLARS.map((p) => {
                                const isActive = activePillar === p.id;
                                return (
                                    <button key={p.id} onClick={() => setActivePillar(isActive ? null : p.id)} className={`pillar-card btn-3d-base ${isActive ? 'active' : ''} ${p.theme}`}>
                                        <div className="pillar-header">
                                            <div className="pillar-icon figure-3d">{p.emoji}</div>
                                            <h4 className="pillar-title">{p.name}</h4>
                                        </div>
                                        <div className="pillar-content">
                                            <p className="text-sm font-medium" style={{color: 'var(--slate-600)', marginBottom: '1rem'}}>{p.desc}</p>
                                            <div className="pillar-tip-box">
                                                <div className="font-black text-xs uppercase" style={{display:'flex', alignItems:'center', gap:'0.5rem', marginBottom:'0.5rem', color: 'var(--t-text)'}}>
                                                    <Icon name="star" className="icon-sm"/> Súperpoder: {p.power}
                                                </div>
                                                <p className="text-sm font-bold" style={{color: 'var(--t-text)', display: 'flex', gap: '0.5rem'}}>
                                                    <span>🎯</span> {p.reto}
                                                </p>
                                            </div>
                                        </div>
                                        {!isActive && (
                                            <div className="pillar-footer">
                                                <span className="pillar-hint">Toca para abrir</span>
                                            </div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="card-3d" style={{padding: '2rem'}}>
                        <div style={{display:'flex', flexDirection:'column', gap:'0.5rem', marginBottom:'2.5rem'}}>
                            <h3 className="text-2xl font-black" style={{display:'flex', alignItems:'center', gap:'0.75rem'}}>
                                <span className="text-3xl figure-3d">🏋️‍♀️</span> Estación 1: Pensamientos
                            </h3>
                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                                <p className="font-medium" style={{color:'var(--slate-600)'}}>Toca las tarjetas para hackear la trampa mental.</p>
                                <span className="font-black text-xs uppercase" style={{color:'var(--emerald-800)', background:'var(--emerald-100)', padding:'0.5rem 1rem', borderRadius:'var(--radius-full)', border:'1px solid var(--emerald-200)'}}>{GYM_THOUGHTS.length} Ejercicios</span>
                            </div>
                        </div>

                        <div className="gym-grid">
                            {GYM_THOUGHTS.map((t) => {
                                const isFlipped = flippedThoughts[t.id];
                                return (
                                    <div key={t.id} onClick={() => toggleFlip(t.id)} className={`thought-card btn-3d-base ${isFlipped ? 'theme-emerald theme-card' : 'theme-rose theme-card'}`}>
                                        {!isFlipped ? (
                                            <div className="animate-fade-in" style={{width: '100%'}}>
                                                <span className="thought-badge theme-card" style={{background: 'var(--white)'}}>{t.type}</span>
                                                <span className="thought-emoji figure-3d" style={{opacity: 0.9}}>{t.emoji}</span>
                                                <h4 className="font-black text-xs uppercase" style={{marginBottom: '0.5rem'}}>Automático</h4>
                                                <p className="text-sm font-bold">"{t.negative}"</p>
                                                <span style={{fontSize:'0.625rem', textTransform:'uppercase', fontWeight:900, background:'rgba(255,255,255,0.6)', padding:'0.25rem 0.75rem', borderRadius:'var(--radius-full)', display:'inline-block', marginTop:'1rem', color:'var(--rose-500)'}}>Toca para transformar</span>
                                            </div>
                                        ) : (
                                            <div className="animate-fade-in" style={{width: '100%'}}>
                                                <span className="thought-badge theme-card" style={{background: 'var(--white)'}}>Hackeado</span>
                                                <span className="thought-emoji figure-3d animate-bounce">{t.emojiPos}</span>
                                                <h4 className="font-black text-xs uppercase" style={{marginBottom: '0.5rem'}}>Respuesta Inteligente</h4>
                                                <p className="text-sm font-bold">"{t.positive}"</p>
                                            </div>
                                        )}
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <div className="card-3d wise-layout">
                        <div style={{marginBottom: '2.5rem'}}>
                            <h3 className="text-2xl font-black" style={{display:'flex', alignItems:'center', gap:'0.75rem', marginBottom:'0.75rem', color: 'var(--indigo-900)'}}>
                                <span className="text-3xl figure-3d">⚖️</span> Estación 2: La Mente Sabia
                            </h3>
                            <p className="text-lg font-medium" style={{color: 'var(--indigo-800)', opacity: 0.8}}>
                                La <strong>Mente Emocional</strong> siente sin filtro. La <strong>Mente Racional</strong> analiza fríamente. 
                                La <strong>Mente Sabia</strong> es la integración perfecta.
                            </p>
                        </div>

                        <div style={{display: 'flex', flexWrap:'wrap', gap: '0.75rem', justifyContent: 'center', marginBottom: '2rem'}}>
                            {WISE_MIND_SCENARIOS.map(s => (
                                <button key={s.id} onClick={() => changeScenario(s.id)} className={`nav-btn btn-3d-base ${activeScenario === s.id ? 'active' : 'inactive'}`}>
                                    Escenario {s.id}
                                </button>
                            ))}
                        </div>

                        <div style={{background: 'var(--white)', borderRadius: 'var(--radius-3xl)', padding: '2rem', border: '2px solid var(--indigo-100)', boxShadow: 'var(--shadow-lg)'}}>
                            <div className="scenario-box">
                                <span className="font-black text-xs uppercase" style={{color: 'var(--indigo-500)', display: 'block', marginBottom: '0.5rem', letterSpacing: '0.1em'}}>Situación</span>
                                <h4 className="font-black text-xl" style={{color: 'var(--indigo-950)'}}>"{currentScenario.context}"</h4>
                            </div>

                            <div className="mind-nodes">
                                <div onClick={() => toggleNode('emotional')} className={`mind-node btn-3d-base ${revealedNodes.emotional ? 'theme-rose theme-card' : 'theme-slate theme-card'}`} style={{borderColor: revealedNodes.emotional ? 'var(--t-border)' : 'var(--slate-200)', background: revealedNodes.emotional ? 'var(--t-bg)' : 'var(--slate-50)'}}>
                                    {!revealedNodes.emotional ? (
                                        <div className="animate-fade-in">
                                            <span className="text-5xl block figure-3d" style={{marginBottom: '1rem'}}>🔥</span>
                                            <span className="mind-node-hint">Toca para ver Emoción</span>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in">
                                            <span className="text-4xl block" style={{marginBottom: '0.75rem'}}>{currentScenario.emotional.emoji}</span>
                                            <h5 className="font-black text-xs uppercase" style={{marginBottom: '0.75rem', letterSpacing: '0.1em'}}>Mente Emocional</h5>
                                            <p className="text-sm font-bold">"{currentScenario.emotional.text}"</p>
                                        </div>
                                    )}
                                </div>

                                <div onClick={() => toggleNode('rational')} className={`mind-node btn-3d-base ${revealedNodes.rational ? 'theme-blue theme-card' : 'theme-slate theme-card'}`} style={{borderColor: revealedNodes.rational ? 'var(--t-border)' : 'var(--slate-200)', background: revealedNodes.rational ? 'var(--t-bg)' : 'var(--slate-50)'}}>
                                    {!revealedNodes.rational ? (
                                         <div className="animate-fade-in">
                                            <span className="text-5xl block figure-3d" style={{marginBottom: '1rem'}}>🤖</span>
                                            <span className="mind-node-hint">Toca para ver Razón</span>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in">
                                            <span className="text-4xl block" style={{marginBottom: '0.75rem'}}>{currentScenario.rational.emoji}</span>
                                            <h5 className="font-black text-xs uppercase" style={{marginBottom: '0.75rem', letterSpacing: '0.1em'}}>Mente Racional</h5>
                                            <p className="text-sm font-bold">"{currentScenario.rational.text}"</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div onClick={() => toggleNode('wise')} className={`mind-node wise-node btn-3d-base ${revealedNodes.wise ? 'theme-purple theme-card' : 'theme-slate theme-card'}`} style={{borderColor: revealedNodes.wise ? 'var(--t-border)' : 'var(--slate-200)', background: revealedNodes.wise ? 'var(--t-bg)' : 'var(--slate-50)'}}>
                                {!revealedNodes.wise ? (
                                    <div className="animate-fade-in">
                                        <span className="text-6xl block figure-3d" style={{marginBottom: '1rem', opacity: 0.7}}>🦉</span>
                                        <span className="mind-node-hint">Toca para integrar la Mente Sabia</span>
                                    </div>
                                ) : (
                                    <div className="animate-fade-in">
                                        <span className="text-6xl block figure-3d animate-pulse" style={{marginBottom: '1rem'}}>{currentScenario.wise.emoji}</span>
                                        <h5 className="font-black text-lg uppercase" style={{marginBottom: '1rem', letterSpacing: '0.1em'}}>🧠 Mente Sabia</h5>
                                        <p className="text-lg font-black" style={{color: 'var(--indigo-950)'}}>"{currentScenario.wise.text}"</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="control-layout theme-emerald theme-card" style={{background: 'var(--white)', border: '2px solid var(--t-border)'}}>
                        <div style={{marginBottom: '2.5rem', position: 'relative', zIndex: 10}}>
                            <h3 className="text-2xl font-black" style={{display:'flex', alignItems:'center', gap:'0.75rem', marginBottom:'0.75rem'}}>
                                <span className="text-3xl figure-3d">⭕</span> Estación 3: El Círculo de Control
                            </h3>
                            <p className="text-lg font-medium" style={{opacity: 0.8}}>
                                Gran parte de nuestra ansiedad se dispara cuando intentamos controlar lo incontrolable. 
                                Evalúa la situación: <strong>¿Está en tus manos?</strong>
                            </p>
                        </div>

                        <div style={{background: 'var(--white)', borderRadius: 'var(--radius-3xl)', padding: '2rem', border: '2px solid var(--t-border)', boxShadow: 'var(--shadow-lg)', display: 'flex', flexDirection: 'column', justifyContent: 'center', minHeight: '350px'}}>
                            {!controlFinished ? (
                                <>
                                    <div style={{textAlign: 'center', marginBottom: '2rem'}}>
                                        <span className="font-black text-sm" style={{background: 'var(--t-bg)', padding: '0.5rem 1rem', borderRadius: 'var(--radius-full)', border: '1px solid var(--t-border)'}}>
                                            Situación {controlStep + 1} de {CONTROL_ITEMS.length}
                                        </span>
                                    </div>

                                    {controlFeedback ? (
                                        <div className="animate-fade-in" style={{padding: '2rem', borderRadius: 'var(--radius-3xl)', textAlign: 'center', border: '2px solid', background: controlFeedback.type === 'success' ? 'var(--emerald-100)' : 'var(--rose-100)', borderColor: controlFeedback.type === 'success' ? 'var(--emerald-400)' : 'var(--rose-400)', color: controlFeedback.type === 'success' ? 'var(--emerald-900)' : 'var(--rose-900)'}}>
                                            <span className="text-5xl block figure-3d" style={{marginBottom: '1rem'}}>{controlFeedback.type === 'success' ? '✅' : '🤔'}</span>
                                            <p className="text-xl font-black">{controlFeedback.text}</p>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in" style={{display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
                                            <h4 className="text-2xl font-black text-center" style={{marginBottom: '2.5rem'}}>
                                                "{CONTROL_ITEMS[controlStep].text}"
                                            </h4>
                                            <div className="control-btns">
                                                <button onClick={() => handleControlAnswer(true)} className="control-btn btn-3d-base theme-emerald theme-card" style={{border: '2px solid var(--t-border)', boxShadow: '0 4px 0 var(--t-border)'}}>
                                                    🎯 En mi control
                                                </button>
                                                <button onClick={() => handleControlAnswer(false)} className="control-btn btn-3d-base" style={{border: '2px solid var(--slate-200)', background: 'var(--slate-50)', color: 'var(--slate-700)', boxShadow: '0 4px 0 var(--slate-200)'}}>
                                                    🌬️ Fuera de mi control
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </>
                            ) : (
                                <div className="animate-fade-in text-center">
                                    <span className="text-6xl block figure-3d" style={{marginBottom: '1rem'}}>🏆</span>
                                    <h4 className="text-3xl font-black mb-4">¡Entrenamiento Completado!</h4>
                                    <p className="text-lg font-medium" style={{marginBottom: '2rem', maxWidth: '36rem', margin: '0 auto 2rem', color:'var(--emerald-900)'}}>
                                        Recuerda: Tu paz mental crece exponencialmente cuando sueltas lo que no puedes controlar y te enfocas 100% en lo que sí depende de ti.
                                    </p>
                                    <button onClick={resetControl} className="btn-primary btn-3d-base" style={{background:'var(--emerald-600)', boxShadow:'0 6px 0 var(--emerald-800)'}}>
                                        Volver a entrenar
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [activeTab, setActiveTab] = useState('chequeador');

            return (
                <div className="app-container">
                    <div className="header">
                        <div className="header-top">
                            <div className="header-badge">
                                <div className="header-icon-bg"><Icon name="sparkles" className="icon" /></div>
                                <span className="header-tag">Pastoral y bienestar UCN</span>
                            </div>
                        </div>
                        <div className="nav-scroll no-scrollbar">
                            <div className="nav-container">
                                {[
                                    { id: 'chequeador', name: 'Chequeador', emoji: '🎛️' },
                                    { id: 'inteligencia', name: 'Inteligencia Emocional', emoji: '💡' },
                                    { id: 'simulador', name: 'Simulador', emoji: '🔬' },
                                    { id: 'casos', name: 'Casos Reales', emoji: '💬' },
                                    { id: 'educacion', name: 'Psicoeducación', emoji: '🧠' }
                                ].map(tab => (
                                    <button key={tab.id} onClick={() => {setActiveTab(tab.id); window.scrollTo(0,0);}}
                                        className={`nav-btn btn-3d-base ${activeTab === tab.id ? 'active' : 'inactive'}`}>
                                        <span>{tab.emoji}</span> {tab.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    <main className="main-content">
                        <div className="content-wrapper">
                            {activeTab === 'chequeador' && (
                                <div>
                                    <header className="hero-header animate-fade-in">
                                        <h1 className="hero-title">Refugio Emocional</h1>
                                        <p className="hero-desc">
                                            Tu espacio seguro para identificar, comprender y transformar tus emociones con <span className="hero-highlight">consciencia y cuidado integral.</span>
                                        </p>
                                    </header>
                                    <ChequeadorView />
                                </div>
                            )}
                            {activeTab === 'simulador' && <SimuladorView />}
                            {activeTab === 'casos' && <CasosView />}
                            {activeTab === 'educacion' && <PsicoEduView />}
                            {activeTab === 'inteligencia' && <InteligenciaEmocionalView />}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
